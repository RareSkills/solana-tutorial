<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" font-family="monospace" font-size="13">

  <!-- Background -->
  <rect width="660" height="280" fill="#1e1e2e" rx="10"/>

  <!-- Header -->
  <text x="30"  y="36" fill="#6c7086" font-size="12" text-anchor="middle">Frame</text>
  <text x="95"  y="36" fill="#6c7086" font-size="12" text-anchor="middle">r0</text>
  <text x="185" y="36" fill="#6c7086" font-size="12" text-anchor="middle">r1</text>
  <text x="265" y="36" fill="#6c7086" font-size="12" text-anchor="middle">...</text>
  <text x="375" y="36" fill="#f38ba8" font-size="12" text-anchor="middle" font-weight="bold">r10</text>
  <text x="560" y="36" fill="#6c7086" font-size="12" text-anchor="middle">Instruction</text>

  <!-- Divider -->
  <line x1="20" y1="44" x2="640" y2="44" stroke="#313244" stroke-width="1"/>

  <!-- r10 column highlight band -->
  <rect x="315" y="48" width="120" height="160" fill="#2a2a3e" rx="0"/>

  <!-- Row 0 -->
  <rect x="20" y="52" width="620" height="28" fill="#181825" rx="3"/>
  <text x="30"  y="71" fill="#6c7086" text-anchor="middle">0</text>
  <text x="95"  y="71" fill="#a6adc8" text-anchor="middle">0x00...00</text>
  <text x="185" y="71" fill="#a6adc8" text-anchor="middle">0x400000000</text>
  <text x="265" y="71" fill="#45475a" text-anchor="middle">...</text>
  <text x="375" y="71" fill="#f38ba8" text-anchor="middle" font-weight="bold">0x200001000</text>
  <text x="560" y="71" fill="#fab387" text-anchor="middle">or64 r0, 0</text>

  <!-- Row 1 -->
  <rect x="20" y="88" width="620" height="28" fill="#1e1e2e" rx="3"/>
  <text x="30"  y="107" fill="#6c7086" text-anchor="middle">1</text>
  <text x="95"  y="107" fill="#a6adc8" text-anchor="middle">0x00...00</text>
  <text x="185" y="107" fill="#a6adc8" text-anchor="middle">0x400000000</text>
  <text x="265" y="107" fill="#45475a" text-anchor="middle">...</text>
  <text x="375" y="107" fill="#f38ba8" text-anchor="middle" font-weight="bold">0x200001000</text>
  <text x="560" y="107" fill="#cba6f7" text-anchor="middle">exit</text>

  <!-- Brace showing r10 unchanged -->
  <line x1="426" y1="62" x2="432" y2="62" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="432" y1="62" x2="432" y2="98" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="432" y1="98" x2="426" y2="98" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="436" y="84" fill="#f38ba8" font-size="12">unchanged</text>

  <!-- Legend -->
  <rect x="20" y="168" width="620" height="90" fill="#181825" rx="6"/>
  <text x="40" y="190" fill="#6c7086" font-size="12">r10 starts at 0x200001000 (MM_STACK_START + stack_frame_size)</text>
  <text x="40" y="210" fill="#fab387" font-size="12">add r10, -64 is rewritten by the VM to or64 r0, 0</text>
  <text x="40" y="230" fill="#6c7086" font-size="12">r10 holds the same value on both frames — the write was silently discarded</text>

</svg>
